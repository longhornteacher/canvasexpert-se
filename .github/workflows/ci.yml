name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test, vet and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Check compiled MCP locally
        shell: pwsh
        run: node scripts/check-mcp.mjs dist/cse.exe
